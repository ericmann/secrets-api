---
# CI for the Secrets API feature plugin.
#
# `make ci` is the single source of truth (see docs/ci.md and README.md) — every
# job here is a thin wrapper around Makefile targets, so a green `make ci`
# locally means a green pipeline. If the two ever disagree, the Makefile is
# right and this file is wrong.
#
# Every action is pinned by full commit SHA rather than by tag. A tag is
# mutable and this repository implements a credential store, so an action that
# silently changes under a moved tag is exactly the supply-chain shape worth
# refusing here. Each SHA below was resolved from the GitHub API at the version
# noted beside it, not copied from documentation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, publishes a package, or needs a token
# beyond reading the code under test.
permissions:
  contents: read

# Only the newest run per ref needs to finish; superseded pushes cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Gates everything else. Cheap, needs no database, and catches the most
  # common mistakes (coding standard, PHP 7.4 syntax, static analysis) before
  # any matrix leg spins up MySQL. One PHP version is enough: these tools
  # analyse source text rather than running it.
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          # sodium is not optional for this project: the whole API is built on
          # it, and phpstan resolves sodium_* signatures from the loaded
          # extension rather than from stubs.
          extensions: sodium
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - run: make lint
      - run: make compat
      - run: make analyse

  # The 7.4 leg is not optional. Core's floor is 7.4 and src/ has to run there;
  # `make compat` catches syntax statically, but only a running 7.4 catches a
  # runtime behaviour difference. WP trunk is included so a core change that
  # breaks this API surfaces here rather than on someone's site — a red trunk
  # leg is worth investigating every time rather than being marked
  # continue-on-error and quietly ignored.
  test:
    name: "PHP ${{ matrix.php }} / WP ${{ matrix.wp }}"
    needs: static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.3']
        wp: ['latest', 'trunk']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, mysqli
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      # `make install` runs composer install and bin/install-wp-tests.sh
      # together, so there is no separate composer step here.
      - name: Install dependencies and the WordPress test suite
        run: make install WP_VERSION=${{ matrix.wp }} DB_HOST=127.0.0.1

      - run: make test

  # Separate from the matrix above rather than crossed into it: multisite
  # exercises scope selection and capability wiring, not PHP-version-specific
  # behaviour, so proving it once on the newest supported PHP is the useful
  # signal. Crossing it into the full matrix would double the runtime for
  # repetition rather than coverage.
  test-multisite:
    name: Multisite
    needs: static
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: sodium, mysqli
          coverage: none
          tools: composer

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install dependencies and the WordPress test suite
        run: make install WP_VERSION=latest DB_HOST=127.0.0.1

      - run: make test-ms
